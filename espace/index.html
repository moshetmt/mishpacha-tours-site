<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex, nofollow">
<title>Espace Mendel · Winter Prestige</title>
<!-- Page à mettre sur l'écran d'accueil (30/10/2026, même mécanique que clim69.fr/suivi/) :
     l'Apps Script « Espace Mendel » en plein écran, avec l'icône hassid + flocon. La clé reste
     dans l'adresse de l'icône (?k=...), rien n'est stocké ici. ?s= choisit le déploiement
     (aperçu ou production), ?ligne= et ?onglet= sont transmis tels quels. Pas de manifeste :
     Chrome Android garderait l'adresse de départ du manifeste et perdrait la clé. -->
<link rel="icon" href="/img/icone-espace-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="/img/icone-espace-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="/img/icone-espace-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mendel">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111111">
<style>
html,body{margin:0;height:100%;background:#fff;font:300 16px/1.5 Jost,"Segoe UI",Arial,sans-serif;color:#111}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
main{max-width:480px;margin:0 auto;padding:64px 24px}
h1{font:400 14px/1.3 Jost,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;margin:0 0 16px}
p{margin:0 0 12px;color:#6B6B6B}
.hors{position:fixed;right:12px;bottom:8px;font-size:11px;color:#6B6B6B;text-decoration:underline}
</style>
</head>
<body>
<script>
(function () {
  var p = new URLSearchParams(location.search), k = p.get('k') || '';
  var PROD = 'AKfycbz9BOV80s-OY8i66FZsFM-zoD4icjchnWwckSBWVtcg7KzPq6xSgPqHF9D2NGP_M7KW';
  var s = (p.get('s') || PROD).replace(/[^A-Za-z0-9_-]/g, '');
  if (!/^[A-Za-z0-9_-]{6,}$/.test(k)) {
    document.body.innerHTML = '<main><h1>Espace Mendel</h1><p>Ouvre cette page depuis le lien reçu par WhatsApp, puis ajoute-la à l’écran d’accueil : l’icône gardera ta clé.</p></main>';
    return;
  }
  var q = 'page=mendel&k=' + encodeURIComponent(k);
  ['ligne', 'onglet'].forEach(function (n) { var v = p.get(n); if (v) q += '&' + n + '=' + encodeURIComponent(v); });
  var url = 'https://script.google.com/macros/s/' + s + '/exec?' + q;
  var f = document.createElement('iframe'); f.src = url; f.title = 'Espace Mendel'; f.setAttribute('allow', 'clipboard-write');
  var a = document.createElement('a'); a.href = url; a.className = 'hors'; a.textContent = 'Ouvrir dans le navigateur'; a.target = '_top';
  document.body.appendChild(f); document.body.appendChild(a);
})();
</script>
</body>
</html>
